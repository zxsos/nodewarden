name = "nodewarden"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# WebAuthn / Passkey 配置（非敏感，仅域名相关，公开无妨）
# 写在这里防止 Cloudflare GitHub 构建时覆盖丢弃
[vars]
WEBAUTHN_RP_ID = "bitwarden.zxsos.ccwu.cc"
WEBAUTHN_RP_NAME = "NodeWarden"
WEBAUTHN_ALLOWED_ORIGINS = "https://bitwarden.zxsos.ccwu.cc"

[build]
command = "npm run build"

[assets]
binding = "ASSETS"
directory = "./dist"
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = [ "*/5 * * * *" ]

[[d1_databases]]
binding = "DB"
database_name = "nodewarden-db"

[[durable_objects.bindings]]
name = "NOTIFICATIONS_HUB"
class_name = "NotificationsHub"

[[durable_objects.bindings]]
name = "BACKUP_TRANSFER_RUNNER"
class_name = "BackupTransferRunner"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "nodewarden-attachments"

[[migrations]]
tag = "v1-notifications-hub"
new_sqlite_classes = [ "NotificationsHub" ]

[[migrations]]
tag = "v2-backup-transfer-runner"
new_sqlite_classes = [ "BackupTransferRunner" ]
